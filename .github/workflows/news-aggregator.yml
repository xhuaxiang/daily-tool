name: "📰 Global Financial News Aggregator"

on:
  schedule:
    # 每 4 小时运行（UTC+8: 6:00, 10:00, 14:00, 18:00, 22:00, 次日 2:00）
    - cron: "7 */4 * * *"
  # 允许手动触发
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run aggregator
        run: python feed/aggregator.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/aggregated.xml
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "📰 Auto-update aggregated feed [skip ci]"
            git push
          fi
